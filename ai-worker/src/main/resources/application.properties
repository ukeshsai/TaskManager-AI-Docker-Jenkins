spring.application.name=task-manager-ai-worker
spring.main.web-application-type=none

spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USER:task_manager}
spring.artemis.password=${ARTEMIS_PASSWORD}
spring.jms.listener.concurrency=1
spring.jms.listener.session.transacted=true

app.ai.request-queue=${CHAT_QUEUE:chat.requests}
app.ai.request-dead-letter-queue=${CHAT_DEAD_LETTER_QUEUE:chat.requests.dlq}

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:1.5b}
app.ai.time-zone=${AI_TIME_ZONE:Asia/Kolkata}
