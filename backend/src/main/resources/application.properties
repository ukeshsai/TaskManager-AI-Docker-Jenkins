spring.application.name=task-manager

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/task_manager}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:1.5b}

spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USER:task_manager}
spring.artemis.password=${ARTEMIS_PASSWORD}
spring.jms.listener.concurrency=1

app.chat.queue=${CHAT_QUEUE:chat.requests}
app.chat.dead-letter-queue=${CHAT_DEAD_LETTER_QUEUE:chat.requests.dlq}
